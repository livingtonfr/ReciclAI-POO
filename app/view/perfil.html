{% extends 'base.html' %}

{% block title %}Recicl.AI - Meu perfil{% endblock %}

{% block content %}
<div class="tela-cadastro">
    <div class="faixa"></div>
    <h1 class="marca">Recicl.AI</h1>
    <p class="subtitulo">Meu perfil</p>

    <form method="POST" action="{{ url_for('perfil') }}">
        <div class="campo">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" value="{{ usuario.nome }}" required>
        </div>
        <div class="campo">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" value="{{ usuario.email }}" required>
        </div>
        <div class="campo">
            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" value="{{ usuario.telefone }}" required>
        </div>
        <div class="campo">
            <label for="endereco">Endereço</label>
            <input id="endereco" name="endereco" type="text" value="{{ usuario.endereco }}" required>
        </div>
        <button class="botao" type="submit">Salvar alterações</button>
    </form>

    <p class="rodape-link">
        <a class="link-verde" href="{{ url_for('dashboard') }}">&larr; Voltar ao dashboard</a>
    </p>
</div>
{% endblock %}
