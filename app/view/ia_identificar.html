{% extends 'base.html' %}

{% block title %}Recicl.AI - Identificar resíduo{% endblock %}

{% block content %}
<div class="tela-ia">
    <div class="faixa"></div>
    <h1 class="marca">Recicl.AI</h1>
    <p class="subtitulo">Identificar resíduo</p>

    <form method="POST" action="{{ url_for('ia_identificar') }}">
        <div class="cartao-foto">
            <div class="icone-foto">📷</div>
            <p class="texto-foto">Tire uma foto do material para a IA identificar</p>
        </div>

        <input type="hidden" name="foto" value="foto_garrafa_pet.jpg">
        <button class="botao" type="submit">Analisar exemplo</button>
    </form>

    <p class="rodape-link">
        <a class="link-verde" href="{{ url_for('dashboard') }}">&larr; Voltar ao início</a>
    </p>
</div>
{% endblock %}
