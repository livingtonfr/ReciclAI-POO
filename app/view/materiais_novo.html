{% extends 'base.html' %}

{% block title %}Recicl.AI - Registrar material{% endblock %}

{% block content %}
<div class="tela-cadastro">
    <div class="faixa"></div>
    <h1 class="marca">Recicl.AI</h1>
    <p class="subtitulo">Registrar material</p>

    <form method="POST" action="{{ url_for('materiais_novo') }}">
        <div class="campo">
            <label for="tipo_id">Tipo de material</label>
            <select id="tipo_id" name="tipo_id" required>
                {% for tipo in tipos %}
                <option value="{{ tipo.id }}">{{ tipo.nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="campo">
            <label for="pesoKg">Peso (kg)</label>
            <input id="pesoKg" name="pesoKg" type="number" step="0.1" min="0.1" placeholder="10.0" required>
        </div>
        <div class="campo">
            <label for="condicaoDeclarada">Condição declarada</label>
            <select id="condicaoDeclarada" name="condicaoDeclarada" required>
                {% for condicao in condicoes %}
                <option value="{{ condicao.name }}">{{ condicao.value }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="campo">
            <label for="observacoes">Observações (opcional)</label>
            <input id="observacoes" name="observacoes" type="text" placeholder="Garrafa separada para reciclagem">
        </div>
        <button class="botao" type="submit">Registrar</button>
    </form>

    <p class="rodape-link">
        <a class="link-verde" href="{{ url_for('materiais') }}">&larr; Voltar aos meus materiais</a>
    </p>
</div>
{% endblock %}
